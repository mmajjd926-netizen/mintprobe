<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mintprobe — does your Cashu mint speak the NUTs?</title>
    <meta name="description" content="Conformance checks for Cashu mints, run from your browser against any mint URL. Every request and response is shown." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />
  </head>
  <body>
    <header>
      <h1><span>🔬</span> Mintprobe</h1>
      <p class="sub">Does your Cashu mint speak the NUTs? Checks written from the spec text, run from your browser, every request shown.</p>
    </header>
    <main>
      <form id="run" class="runbar">
        <input id="url" type="url" list="known" placeholder="https://your.mint" required />
        <datalist id="known"></datalist>
        <button id="go">Check</button>
      </form>
      <p id="note" class="note"></p>
      <section id="report"></section>
      <section id="matrix"><h2>Public mints today</h2><p class="note">Loading…</p></section>
    </main>
    <footer>
      Open source (MIT): <a href="https://github.com/mmajjd926-netizen/mintprobe">github.com/mmajjd926-netizen/mintprobe</a> ·
      Spec: <a href="https://github.com/cashubtc/nuts">cashubtc/nuts</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
